# Linear steering, density, LAYER 7, prompts WITHOUT the space group.
# Layer 7 is where the density probe peaks (R^2 0.947 by_formula); layer 14 is where
# every earlier density arm ran. No --with-spacegroup here, so these form their own
# `nosg` family and pair only against the alpha=0 nosg control -- submit that too.
# Override --alpha per run: 0 (control), 16, 40, 80.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method linear --steering-property density_atomic
      --layer 7 --alpha 40 --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/density_atomic"
