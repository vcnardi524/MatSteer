# Linear band-gap steering for llamat2-cif at layer 24, on the conditional prompt set.
#
# STRENGTH IS SET WITH --alpha-rel, NOT --alpha. The stored vector is unit-norm, so alpha
# is the ABSOLUTE norm added to the hidden state -- and hidden states are not the same
# size across models. Measured per-token on answer tokens: crystallm layer 14 has
# |h| = 165.8, llamat layer 24 has |h| = 22.2. So crystallm's routine alpha 40 is 24% of
# its residual stream but 180% of llamat's, which overwrites rather than steers: llamat
# degenerates into repetition (`F.22 F.72 F.72...`) and decodes to nothing.
#
# raw_norm -- the class-mean difference before normalising -- is ~10% of |h| in BOTH
# models at every layer measured (crystallm L14 10.5%, llamat L24 10.9%), so it is the
# portable unit. --alpha-rel 1 is one class separation. Override it to sweep:
#   ./run.sh steer_llamat2_cif_bandgap --alpha-rel 0.5
#   ./run.sh steer_llamat2_cif_bandgap --alpha-rel 2
#   ./run.sh steer_llamat2_cif_bandgap --alpha-rel 3
# For reference crystallm's alpha 16 is 0.91x and alpha 40 is 2.3x.
#
# Pairs against baseline_llamat2_cif on the same 1,000 ids.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="llamat"
QUEUE="gpu"
GPUS="1"
TIME="24:00:00"
MEM="32G"
CPUS="4"
ARGS="--model llamat2_cif --ckpt-dir models/llamat2_cif
      --prompt-csv data/llamat_test_sample1000.csv
      --method linear --steering-property band_gap
      --layer 24 --alpha-rel 1 --n-samples 3
      --max-new-tokens 600 --temperature 0.01 --top-p 0.95
      --paired-seed --torch-dtype float16
      --results-dir steering_results/band_gap"
