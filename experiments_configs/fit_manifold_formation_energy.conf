# 1-D manifold through formation-energy bucket centroids, MP labels, layer 7.
#
# Width 0.25 eV/atom keeps 37 buckets above the 30-structure floor, spanning -4.5 to
# +4.75. (0.1 keeps 83 but thins the tails; 0.5 keeps only 19.)
#
# partition=not_heldout is train PLUS the MP structures CrystaLLM's split index never
# mentions, and nothing from val or test -- 148,873 structures.
#
# NO --max-per-bucket here, and the matching centroid plot must be generated without one
# too. fit_manifold has no such flag, so a centroid plot capped at 5,000/bucket would put
# the spline and the points it is drawn over on different samples. That mismatch is what
# produced a bogus 58.7-degree turning angle for density earlier.
SCRIPT="scripts/steering/fit_manifold.py"
VENV="crystallm"
QUEUE="batch"
TIME="6:00:00"
MEM="64G"
CPUS="8"
ARGS="--property formation_energy_per_atom --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --partition not_heldout --layer 7 --k 64 --width 0.25"
