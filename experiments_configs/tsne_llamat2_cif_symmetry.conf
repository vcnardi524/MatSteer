# PCA and t-SNE of llamat2-cif embeddings coloured by symmetry, on the SEEN pool
# (not_heldout -- everything we have no evidence LLaMat held out).
#
# Labels come from symmetry_v1_mp.parquet, derived from the CIF text by
# scripts/data/build_symmetry_mp.py: metadata_mp.parquet carries no symmetry column in
# any of its 56, and metadata.parquet (NOMAD) does not cover this corpus.
#
# Note what the input actually contains. The crystal string llamat2-cif reads has NO
# space group line -- it is lengths, angles, and one element+coordinate pair per atom.
# So unlike a `full` CIF run on crystallm, a probe or a cluster here cannot be reading
# the label back off a copied token; the symmetry has to be inferred from the geometry.
SCRIPT="scripts/plots/plot_tsne_pca_categorical.py"
VENV="crystallm"
QUEUE="batch"
TIME="06:00:00"
MEM="96G"
CPUS="8"
ARGS="--dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --n-samples 10000 --top-n 20
      --property point_group --layer 8"
