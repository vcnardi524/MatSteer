# Volume-per-atom manifold, llamat2-cif. Override --layer (12 and 24).
#
# No --max-value: density runs to 3,734 but --min-count 30 already drops the tail on its
# own, leaving buckets 5..58 and 97.8% of the pool. The crystallm manifolds used
# --max-value 40 (hence _max40); we are not comparing against that curve.
SCRIPT="scripts/steering/fit_manifold.py"
VENV="crystallm"
QUEUE="batch"
TIME="04:00:00"
MEM="64G"
CPUS="8"
ARGS="--property density_atomic --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --k 32 --width 1 --layer 12"
