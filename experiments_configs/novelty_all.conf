# Uniqueness + novelty over every validated run, in ONE job. CPU only -- pymatgen's
# StructureMatcher, no model and no GPU.
#
# Why one job and not one per run: step 1 loads all ~2.3M training CIFs and indexes
# their strings by reduced formula. That costs minutes and several GB, and it does not
# depend on the input, so 134 separate jobs would build the same index 134 times.
# --input takes a list and the index is built once. Pass the list as an override:
#
#   ./run.sh novelty_all --input $(ls steering_results/*/validation/*.parquet \
#                                  | grep -v /novelty_)
#
# Each input's results dir is read off its own path, so one job spans every property.
# Already-done inputs are skipped before the index is built, so this is resumable.
SCRIPT="scripts/eval/novelty_steered_cifs.py"
VENV="crystallm"
QUEUE="batch"
TIME="48:00:00"
MEM="64G"
CPUS="4"
EXCLUDE="node11"
ARGS=""
