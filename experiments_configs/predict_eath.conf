# MEGNet formation energy -> Materials Project convex hull -> energy above hull.
# CPU only. megnet_venv is the venv that carries BOTH matgl (for MEGNet-Eform) and
# mp_api (for the live hull lookup); relax_venv has no mp_api and cannot run this.
# Hulls are fetched per chemical system and cached, in FORMATION-energy space, with
# thermo_types pinned to GGA_GGA+U to match what MEGNet-Eform-MP-2018.6.1 predicts --
# see HullLookup in scripts/predictors.py. Coverage over the 1,000-prompt eval set is
# complete: 989/989 systems, 999/999 prompts.
# Needs the MP API key in api_keys.json. Pass --input.
SCRIPT="scripts/eval/compute_predictions.py"
VENV="megnet"
QUEUE="batch"
TIME="12:00:00"
MEM="32G"
CPUS="4"
ARGS="--property energy_above_hull --results-dir steering_results/energy_above_hull"
