# PCA centroid scatter for llamat2-cif; override --property/--width/--layer/--closed.
# Must use the SAME bucketing as the manifold it will be overlaid with, or the centroids
# on the plot are not the ones the curve was fitted through.
SCRIPT="scripts/plots/centroid_pca_plots.py"
VENV="crystallm"
QUEUE="batch"
TIME="04:00:00"
MEM="64G"
CPUS="8"
ARGS="--labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --k 32
      --property density_atomic --width 1 --layer 12"
