# Linear steering, FORMATION ENERGY, layer 7, nosg prompts.
# Vector is p10 vs p90: low <= -2.903 (n=15,488) vs high >= -0.0101 (n=15,483), a clean
# split with zero ties -- unlike energy_above_hull, whose p10 is exactly 0 and swallows
# 22% of the corpus. raw_norm = 14.293.
# POSITIVE alpha steers toward HIGHER formation energy, i.e. less stable.
# Override --alpha per run: 8, 16, 32, 40, 48.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--ckpt-dir CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method linear --steering-property formation_energy_per_atom
      --layer 7 --alpha 16 --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/formation_energy_per_atom"
