# IncrementalPCA basis over the training embeddings at one layer. Everything that works
# in the k=64 subspace -- pca_centroid, pca_local, the manifold, centroid_pca_plots --
# needs the basis for its layer to exist first. Only 7/9/10/14 were ever built.
SCRIPT="scripts/steering/compute_pca_basis.py"
VENV="crystallm"
QUEUE="batch"
TIME="12:00:00"
MEM="64G"
CPUS="8"
ARGS="--layer 14 --k 64 --dataset v1_all --partition train"
