# Linear steering, ENERGY ABOVE HULL, LAYER 10, prompts WITHOUT the space group.
# ALPHAS ARE NEGATIVE. The vector points low-hull -> high-hull, so a negative alpha
# steers toward MORE STABLE, which is the direction worth having.
#
# --pct 10 DOES NOT GIVE TWO EQUAL GROUPS HERE, and the name is misleading. p10 of
# energy_above_hull is exactly 0.0, because every material ON the hull is 0 by
# definition and 33,973 of the 154,879 MP rows (21.94%) sit there. The cut is <= p10,
# so it takes all of them; strictly below p10 there are ZERO materials, so no 10% cut
# exists on that side at any threshold. The high side is a clean decile: >= 0.3763,
# 15,488 rows (10.00%), of which 15,483 had a layer-10 embedding.
#
# So the contrast is "on the hull" vs "the 10% least stable", n=33,973 vs 15,483.
# Unequal n does not bias mean(high) - mean(low); it just estimates the low mean from
# more samples. raw_norm = 3.670.
# Override --alpha per run: -8, -16, -32, -40, -48.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method linear --steering-property energy_above_hull
      --layer 10 --alpha -16 --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/energy_above_hull"
