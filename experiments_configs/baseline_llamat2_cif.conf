# The single no-injection control for every llamat2-cif steering arm.
#
# ONE RUN SERVES ALL TWELVE ARMS. alpha 0 means the hook adds exactly zero -- verified
# byte-identical to registering no hook at all -- so the output is independent of both
# the layer and the property. Layer 0 is named to make that explicit, and no steering
# vector is loaded at all (there is none at layer 0, and its contents would be multiplied
# by zero regardless).
#
# Output goes to steering_results/baseline/, the shared tree utils.steering_path() falls
# back to. crystallm's controls live there too; the stems do not collide because this
# prompt set carries the _cond tag, and pick_control() scores candidates by id overlap,
# which is zero between MP_ ids and crystallm's NOMAD_/OQMD_ ones.
#
# PAIRABLE: the same 1,000 conditional prompts every arm uses, so each arm pairs against
# this control on `id`. --paired-seed makes draw k of every arm share a random stream on
# top of that, so arms differ by the hook and nothing else.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="llamat"
QUEUE="gpu"
GPUS="1"
TIME="24:00:00"
MEM="32G"
CPUS="4"
ARGS="--model llamat2_cif --ckpt-dir models/llamat2_cif
      --prompt-csv data/llamat_test_sample1000.csv
      --method linear --steering-property band_gap
      --layer 0 --alpha 0 --n-samples 3
      --max-new-tokens 600 --temperature 0.01 --top-p 0.95
      --paired-seed --torch-dtype float16
      --results-dir steering_results/baseline"
