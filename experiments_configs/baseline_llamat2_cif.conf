# No-injection control for llamat2-cif, on the CONDITIONAL prompt set.
#
# alpha 0 means the hook adds exactly zero, so the layer is irrelevant and the output is
# property-independent -- one run per PROMPT SET serves every property, which is why this
# writes to steering_results/llamat2_cif_baseline/ rather than under a property.
#
# PAIRABLE. Every arm draws the same 1,000 prompts from data/llamat_test_sample1000.csv,
# so each arm and this control pair on `id` and the paired t-test applies, exactly as it
# does for crystallm. The unconditional prompt cannot do this -- it is one constant
# string with no per-structure id. See CLAUDE.md.
#
# --paired-seed on top: draw k of every arm starts from the same random state, so arms
# differ by the hook and nothing else.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="llamat"
QUEUE="gpu"
GPUS="1"
TIME="24:00:00"
MEM="32G"
CPUS="4"
ARGS="--model llamat2_cif --ckpt-dir models/llamat2_cif
      --prompt-csv data/llamat_test_sample1000.csv
      --method linear --steering-property band_gap
      --layer 24 --alpha 0 --n-samples 3
      --max-new-tokens 600 --temperature 0.01 --top-p 0.95
      --paired-seed --torch-dtype float16
      --results-dir steering_results/llamat2_cif_baseline"
