# Linear steering vector for volume per atom. Right-skewed (4.4 to 3,734) but with no
# pile-up at a single value, so p10 is a real decile split.
SCRIPT="scripts/steering/compute_steering_vector.py"
VENV="crystallm"
QUEUE="batch"
TIME="02:00:00"
MEM="64G"
CPUS="4"
ARGS="--property density_atomic --name density_atomic --metadata metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --pct 10 --layer 8"
