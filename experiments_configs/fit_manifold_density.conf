# 1-D manifold through density bucket centroids. Width 1 A^3/atom is the established
# value for this property -- 82 buckets over the corpus range, and the layer-7/14 fits
# use it, so anything new stays comparable.
SCRIPT="scripts/steering/fit_manifold.py"
VENV="crystallm"
QUEUE="batch"
TIME="6:00:00"
MEM="64G"
CPUS="8"
ARGS="--property density_atomic --labels density_atomic_v1.parquet
      --dataset v1_all --partition train --layer 14 --k 64 --width 1 --max-value 40"
