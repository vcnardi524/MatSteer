# Formation-energy manifold, llamat2-cif. Override --layer (8 and 24).
#
# Left-closed buckets: formation energy is signed with no pile-up at any one value, so
# the band-gap problem does not arise. 37 buckets spanning -4.50..4.75 cover 100%.
SCRIPT="scripts/steering/fit_manifold.py"
VENV="crystallm"
QUEUE="batch"
TIME="04:00:00"
MEM="64G"
CPUS="8"
ARGS="--property formation_energy_per_atom --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --k 32 --width 0.25 --layer 8"
