# Linear steering, BAND GAP, LAYER 4, prompts WITHOUT the space group.
# Layer 4 is where the band-gap probe peaks. The layer-4 vector was rebuilt 2026-09-06
# with layer 14's schema (low <= 0.05 eV, n=575,593; high >= 1.0 eV, n=1,905;
# raw_norm 11.86) -- the file that was there before carried the legacy
# bottom_max_ev = -30.25, a LUMO-HOMO raw-Joules subtraction, and was unusable.
# Prompts are cifs_v1_test_sample1000, so these pair against the shared nosg control
# in steering_results/baseline/, NOT against the older `test_clean` layer-14 family.
# Override --alpha per run: 8, 16, 32, 40, 48.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method linear --steering-property bandgap
      --layer 4 --alpha 16 --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/bandgap"
