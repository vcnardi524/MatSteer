# Spectral co-clustering. CPU only -- no GPU in this script. PARTITION picks the split.
#
# Memory is the binding constraint, not time. partition=all holds 1,633,689 labelled
# structures and train 1,050,498, against test's 7,346, and the script keeps several full copies of the
# (n x 1024) float32 matrix alive at once: X, StandardScaler's X_std, X_pos, and X_sparse.
# That is ~4.3 GB each, so ~20 GB of arrays before SpectralCoclustering's own SVD. 240G
# leaves room for that and for the co-clustering internals.
#
# This script takes POSITIONAL args (n_clusters, run name, layer), so run.sh's
# append-an-override model does not work -- the script reads argv[1:4] and would ignore
# anything appended after them. The conf is a sourced bash file, so the knobs come from
# the environment instead:
#     export PARTITION=train K=150 L=3 && ./run.sh cocluster_train
# PARTITION has no default on purpose: 89.6% of labelled structures are in the model's
# own training set, so a silent default would quietly measure memorisation.
SCRIPT="scripts/analysis/spec_cocluster_analysis.py"
VENV="crystallm"
QUEUE="batch"
TIME="24:00:00"
MEM="180G"
CPUS="8"
# node11 advertises 192G but has been seen with under 5G free -- it OOM-killed a job
# before. See CLAUDE.md.
EXCLUDE="node11"
ARGS="${K:-50} ${RUN_NAME:-sites} ${L:-14}"
