# Manifold steering, ENERGY ABOVE HULL, LAYER 10, width 0.1, nosg prompts.
# SCALE IS NEGATIVE. The injection is scale * (decode(u+delta) - decode(u)) and the
# curve is ordered low-hull -> high-hull, so a negative scale with a positive delta
# points toward MORE STABLE.
# Read the curve before reading a result: it spans 0.05..4.65 eV/atom over arc
# 0..64.36, and the first tenth of the arc already covers 0.05..0.536. Roughly 90%
# of the arc therefore sits above 0.5 eV/atom, where almost no real material lives.
# The useful part of this curve is its first ~6 arc units, which is why delta stays
# at 2-3 and the strength is carried by scale.
# Override --delta (2, 3) and --scale (-1..-10) per run.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property energy_above_hull
      --manifold steering_vectors/manifolds/energy_above_hull_layer10_k64_w0.1_max5.parquet
      --layer 10 --k 64 --delta 2 --variant residual --scale -1
      --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/energy_above_hull"
