# No-injection baseline. alpha=0 means the hook adds exactly zero, so the layer is
# irrelevant and the output is property-independent -- one run per PROMPT SET serves
# every property. Layer 0 is named only to make that explicit.
# Output goes to steering_results/baseline/, shared by all properties. Add
# --with-spacegroup for the sg prompt set.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method linear --steering-property density_atomic
      --layer 0 --alpha 0 --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/baseline"
