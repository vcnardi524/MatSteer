# Manifold steering, density, LAYER 7, prompts WITHOUT the space group.
# Companion to steer_linear_density_l7_nosg.conf: same layer, same prompts, same
# control, so the only difference is curve vs straight line.
# Override --scale per run: 2, 4, 6, 8. At layer 14 scale 6 was the best arm in the
# table (d +0.173 at 94.2% valid) and scale 12 collapsed to 50.1% valid, so this
# sweep brackets the window instead of extending past it.
# The curve itself is gitignored; rebuild it with
#   python scripts/steering/fit_manifold.py --property density_atomic \
#       --partition train --layer 7 --k 64 --width 1 --max-value 40
# giving arc 0..35.43 over density 3.5..39.5 (layer 14's is 0..48.91). Shorter curve,
# so from the control median at arc 27.17 anything past delta ~8.3 clamps at the end:
#   delta 2 -> 22.96, delta 5 -> 30.40, delta 10 and 15 -> 39.50 A^3/atom.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property density_atomic
      --manifold steering_vectors/manifolds/density_atomic_layer7_k64_w1_max40.parquet
      --layer 7 --k 64 --delta 15 --variant residual --scale 6
      --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/density_atomic"
