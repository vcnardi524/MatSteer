# Capture layers 7-15 while steering density at layer 7, to measure how far the injection
# travels. WRITES NO CIFs -- the only output is <results-dir>/embeddings/<stem>.parquet.
# There is no validation/relaxation/prediction stage for these runs.
#
# CPUS=8 rather than 4: the CIFs are scored for validity in a multiprocessing pass at each
# checkpoint (flags only, the CIFs are then discarded). Validity is recorded because
# corr(validity, median density) = -0.91 across the density arms, so a propagation curve
# computed without it cannot be told apart from generation falling apart.
#
# Override per run:
#   --method linear --alpha 32
#   --method manifold --delta 2 --scale 4        (and d2 s10, d3 s4, d3 s10)
#   --method linear --alpha 0 --layer 0 --results-dir steering_results/baseline
SCRIPT="scripts/steering/steer_extract_embeddings.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="8"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property density_atomic
      --manifold steering_vectors/manifolds/density_atomic_layer7_k64_w1_max40.parquet
      --layer 7 --k 64 --delta 2 --variant residual --scale 4
      --capture-layers 7,8,9,10,11,12,13,14,15
      --n-samples 3 --temperature 1.0 --workers 8
      --results-dir steering_results/density_atomic"
