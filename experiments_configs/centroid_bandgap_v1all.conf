# Bucket-centroid PCA for band gap on the full corpus, training split.
# Labels are metadata.parquet:dos_electronic.band_gap in eV -- NOT electronic.band_gap
# and NOT the LUMO-HOMO difference, which is raw Joules and corrupt (see CLAUDE.md).
# ~99% of the corpus is at or near a zero gap, so the first bucket is "this is a metal"
# rather than a gap value; pass --min-value 0.05 for the variant that excludes it.
SCRIPT="scripts/plots/centroid_pca_plots.py"
VENV="crystallm"
QUEUE="batch"
TIME="4:00:00"
MEM="48G"
CPUS="8"
ARGS="--partition train --property dos_electronic.band_gap --labels metadata.parquet
      --dataset v1_all --layer 14 --width 0.05 --sample 5000 --max-per-bucket 5000"
