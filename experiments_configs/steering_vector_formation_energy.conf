# Linear mean-difference steering vector for FORMATION ENERGY, p10 vs p90.
# Override --layer per run. p10 = -2.903 / p90 = -0.0101 gives 15,488 vs 15,483 with zero
# ties -- a clean split, unlike energy_above_hull whose p10 is exactly 0.
SCRIPT="scripts/steering/compute_steering_vector.py"
VENV="crystallm"
QUEUE="batch"
TIME="4:00:00"
MEM="48G"
CPUS="4"
ARGS="--property formation_energy_per_atom --name formation_energy_per_atom
      --metadata metadata_mp.parquet --dataset v1_mp --id-col material_id
      --layer 7 --pct 10"
