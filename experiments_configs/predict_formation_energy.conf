# MEGNet formation energy per atom on generated or relaxed CIFs. CPU only.
# Model: MEGNet-Eform-MP-2018.6.1 (see FormationEnergyPredictor in scripts/predictors.py).
# This is also the input to the hull calculation -- predict_eath.conf takes the same
# E_form and places it on a Materials Project GGA/GGA+U hull -- so running this first
# is useful on its own and is not wasted work.
# Pass --input.
SCRIPT="scripts/eval/compute_predictions.py"
VENV="megnet"
QUEUE="batch"
TIME="12:00:00"
MEM="32G"
CPUS="4"
ARGS="--property formation_energy --results-dir steering_results/formation_energy_per_atom"
