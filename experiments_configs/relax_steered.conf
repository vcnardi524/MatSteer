# M3GNet-PES relaxation. MUST use relax_venv: crystallm_venv's cu130 build cannot run
# on the V100 (sm_70). --steps 500 and --timeout 60 override the python defaults.
SCRIPT="scripts/eval/relax_steered_cifs.py"
VENV="relax"
QUEUE="gpu"
GPUS="1"
TIME="24:00:00"
MEM="32G"
CPUS="4"
ARGS="--results-dir steering_results/bandgap --fmax 0.05 --steps 500 --timeout 60 --checkpoint-every 10"
