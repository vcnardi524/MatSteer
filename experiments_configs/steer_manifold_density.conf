# Manifold steering, density. --delta is a step in ARC LENGTH along the fitted curve.
# delta 2 -> ~21.5, 5 -> ~25.8, 10 -> ~34.4 A^3/atom from the corpus median of 19.1.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property density_atomic
      --manifold steering_vectors/manifolds/density_atomic_layer14_k64_w1_max40.parquet
      --layer 14 --k 64 --delta 5 --n-samples 3 --temperature 1.0 --with-spacegroup
      --use-cache --results-dir steering_results/density_atomic"
