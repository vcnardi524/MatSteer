# Manifold steering at magnitudes comparable to the methods that actually did something.
# The earlier delta sweep injected 5.2% of |h|; linear alpha=40/80 inject 31%/61%.
#   --variant residual --scale 6   -> ~41  (matches alpha=40)
#   --variant residual --scale 12  -> ~82  (matches alpha=80)
#   --variant project              -> ~95  (drops h_perp; mostly deletion, not steering)
#   --variant project_nomu         -> ~162 (also drops mu)
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property density_atomic
      --manifold steering_vectors/manifolds/density_atomic_layer14_k64_w1_max40.parquet
      --layer 14 --k 64 --delta 15 --n-samples 3 --temperature 1.0 --with-spacegroup
      --use-cache --results-dir steering_results/density_atomic"
