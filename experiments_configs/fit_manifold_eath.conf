# 1-D manifold through energy_above_hull bucket centroids, MP labels.
# Width 0.1 eV/atom: coarser fits better (w0.5 explains 91.4% of centroid spread vs
# w0.1's 84.1%) but collapses 93% of structures into one bucket, leaving no resolution
# inside the stable regime that anyone would actually steer within. 0.1 keeps 46 buckets
# reaching 4.65 eV/atom.
# partition=not_heldout keeps train PLUS the ~96k MP structures in no split -- nothing is
# evaluated against them, so excluding them only costs sample size (52,644 -> 148,780).
SCRIPT="scripts/steering/fit_manifold.py"
VENV="crystallm"
QUEUE="batch"
TIME="6:00:00"
MEM="64G"
CPUS="8"
ARGS="--property energy_above_hull --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --partition not_heldout --layer 10 --k 64 --width 0.1 --max-value 5.0"
