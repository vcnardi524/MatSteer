# Are the manifold's property buckets separable in embedding space?
# Same experiment as symmetry_separability.py with property buckets as the label.
# Override --property/--labels/--id-col/--dataset/--partition/--width per run.
#
# NOTE the composition control needs repeated formulas. On val there are 5,675 formulas
# across 5,745 structures, so only ~137 structures land in a multi-entry group and that
# control is close to empty; not_heldout (148,873) is where it has real data.
SCRIPT="scripts/analysis/bucket_separability.py"
VENV="crystallm"
QUEUE="batch"
TIME="8:00:00"
MEM="96G"
CPUS="8"
EXCLUDE="node11"
ARGS="--property formation_energy_per_atom --labels metadata_mp.parquet
      --id-col material_id --dataset v1_mp --partition val --width 0.25"
