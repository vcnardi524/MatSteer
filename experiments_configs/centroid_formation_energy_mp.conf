# PCA-subspace centroid plot for FORMATION ENERGY, v1_mp embeddings.
#
# Partition is not_heldout -- CrystaLLM's train split plus the structures its split index
# does not mention at all, and NOTHING from val or test. utils.PARTITIONS treats this as
# an exclusion rather than a membership set (see filter_partition): asking for a keep-set
# would silently collapse it back to train and drop the unpartitioned rows.
#
# Formation energy runs -3.69 .. +1.79 over the 1st-99th percentile (median -1.55), so
# useful bucket widths are 0.1 (83 buckets with >=30 rows), 0.25 (37) and 0.5 (19).
# Override --width per run.
#
# Layer 7, to match the density steering work. The formation-energy probe actually peaks
# at layer 8 (R^2 0.904 by_formula vs a 0.327 composition baseline), but layer 7 is only
# 0.902 there and is where every density sweep was run, so the two are comparable.
#
# The PCA basis is the corpus one fitted on v1_all train activations; v1_mp embeddings are
# the same 1024 dimensions, so they project into it directly. That is what
# centroid_bandgap_mp_l14.conf already does.
SCRIPT="scripts/plots/centroid_pca_plots.py"
VENV="crystallm"
QUEUE="batch"
TIME="4:00:00"
MEM="48G"
CPUS="8"
ARGS="--partition not_heldout --property formation_energy_per_atom
      --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --layer 7 --width 0.25 --sample 5000 --max-per-bucket 5000"
