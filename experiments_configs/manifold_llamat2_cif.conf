# Manifold steering for llamat2-cif: slide along the curve fitted through the property's
# bucket centroids, keeping the off-curve offset (--variant residual).
#
# Uses the WIDER bucket manifolds -- band_gap w0.5, formation_energy w0.5, density w3 --
# which are the better-conditioned fits.
#
# BOTH KNOBS ARE SET PER ARM, and neither is portable. --delta is an ARC STEP, and the
# curves differ in length by 12x (band_gap L8 is 1.44, density L24 is 17.91), so a fixed
# step is 69% of one curve and 5.6% of another -- and `decode` clamps u to the curve, so
# on the short curves a large step saturates and two arms collapse into one. Deltas here
# are 10/20/30% of each curve's own length.
#
# --scale sets the injection magnitude, because the curve step alone is small: the
# residual variant adds scale * (decode(u+d) - decode(u)) @ W, whose size is capped by
# the curve's extent. Scales are solved per arm so the injection lands at 20% or 40% of
# that layer's |h| (6.4 at L8, 8.7 at L12, 22.2 at L24), matching what --alpha-rel 2 and
# 4 delivered in the linear sweep. That is what makes the two methods comparable at
# equal push rather than at equal knob value.
#
# Driven by a submission loop that passes --manifold/--delta/--scale/--layer per arm;
# see tasks.md. Everything else matches the linear sweep so the arms pair on id against
# the SAME baseline_llamat2_cif control.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="llamat"
QUEUE="gpu"
GPUS="1"
TIME="24:00:00"
MEM="32G"
CPUS="4"
ARGS="--model llamat2_cif --ckpt-dir models/llamat2_cif
      --prompt-csv data/llamat_test_sample1000.csv
      --method manifold --variant residual --k 32
      --n-samples 3 --max-new-tokens 600
      --temperature 0.01 --top-p 0.95
      --paired-seed --torch-dtype float16"
