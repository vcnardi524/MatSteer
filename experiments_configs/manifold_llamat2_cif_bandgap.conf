# Band-gap manifold, llamat2-cif. Override --layer (8 and 24).
#
# --closed right is the whole point here. MP records every metal as band_gap exactly 0.0,
# and left-closed [0, 0.1) merges 64,165 metals with 4,905 genuine small-gap structures --
# 52% of the corpus in one centroid meaning "metal, or nearly one". (-0.1, 0] isolates the
# metals and gives (0, 0.1] its own centroid.
#
# --prop-value mean is REQUIRED with it: the metals bucket (-0.1, 0] has nominal centre
# -0.05, an unphysical negative band gap that would be printed on every plot and used by
# property_to_arc. The observed mean is exactly 0.0.
#
# Filename gets _rc so a left-closed fit at the same width cannot overwrite it.
SCRIPT="scripts/steering/fit_manifold.py"
VENV="crystallm"
QUEUE="batch"
TIME="04:00:00"
MEM="64G"
CPUS="8"
ARGS="--property band_gap --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --k 32 --width 0.1 --closed right --prop-value mean --layer 8"
