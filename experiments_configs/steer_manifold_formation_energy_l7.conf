# Manifold steering, FORMATION ENERGY, layer 7, width 0.25, nosg prompts.
# Curve: arc 0..48.77 spanning -4.38..+4.62 eV/atom; explains 93.1% of the centroid
# spread against 48.5% for a straight line, arc-vs-property rank correlation +0.9999.
#
# DIRECTION: the curve is ordered low -> high formation energy, so a POSITIVE delta with
# a POSITIVE scale steers toward HIGHER formation energy, i.e. LESS stable. The control's
# median sits at arc 30.4 of 48.8, leaving 18.4 arc units of headroom, so delta 10 stays
# on the curve rather than clamping at the end.
# Override --delta and --scale per run.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property formation_energy_per_atom
      --manifold steering_vectors/manifolds/formation_energy_per_atom_layer7_k64_w0.25.parquet
      --layer 7 --k 64 --delta 3 --variant residual --scale 3
      --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/formation_energy_per_atom"
