# Place an already-predicted formation energy on the Materials Project convex hull.
# CPU only, and MUST use crystallm_venv -- NOT megnet_venv.
#
# The hull step needs mp_api + pymatgen.entries.compatibility; the E_form step needs
# matgl. No venv here has both:
#     venv              matgl     mp_api    pymatgen.entries.compatibility
#     crystallm_venv    BROKEN    yes       yes
#     megnet_venv       yes       yes       BROKEN
#     relax_venv        yes       no        BROKEN
# So the two halves run as separate jobs. Run predict_formation_energy first (megnet),
# then this. Pass --input pointing at the property_predictions parquet.
#
# Needs the MP API key in api_keys.json. Hulls are cached per chemical system, in
# formation-energy space, thermo_types pinned to GGA_GGA+U to match MEGNet-Eform's 2018
# training release -- see HullLookup in scripts/predictors.py.
SCRIPT="scripts/eval/compute_hull.py"
VENV="crystallm"
QUEUE="batch"
TIME="12:00:00"
MEM="16G"
CPUS="2"
ARGS=""
