# Linear steering vector for formation energy. Signed and roughly unimodal, so p10 gives
# a genuine decile-vs-decile contrast here, unlike band gap.
SCRIPT="scripts/steering/compute_steering_vector.py"
VENV="crystallm"
QUEUE="batch"
TIME="02:00:00"
MEM="64G"
CPUS="4"
ARGS="--property formation_energy_per_atom --name formation_energy_per_atom --metadata metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --pct 10 --layer 8"
