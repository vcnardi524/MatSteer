# Linear (CAA) steering vector: normalize(mean(top 10%) - mean(bottom 10%)).
#
# NOTE what p10 actually selects for band gap. ~48% of MP band gaps are exactly 0, so
# p10 = 0 and "<= p10" sweeps in every metal: the low set is 64,165 structures against
# 11,981 on the high side, not 10% and 10%. The contrast is real -- metals vs wide-gap --
# but it is not a symmetric decile split, and the low mean is an average over half the
# corpus. Same zero-inflation that made left-closed bucketing wrong for the manifold.
#
# not_heldout, matching the PCA bases and manifolds: for llamat2_cif the split lists only
# what we know was held out, so train/val are empty and this is the whole fitting pool.
SCRIPT="scripts/steering/compute_steering_vector.py"
VENV="crystallm"
QUEUE="batch"
TIME="02:00:00"
MEM="64G"
CPUS="4"
ARGS="--property band_gap --name band_gap --metadata metadata_mp.parquet --id-col material_id
      --dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --pct 10 --layer 8"
