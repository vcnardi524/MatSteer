# Linear density_atomic steering for llamat2-cif on the conditional prompt set.
#
# STRENGTH IS --alpha-rel, A MULTIPLE OF THIS LAYER'S raw_norm, not an absolute alpha.
# The stored vector is unit-norm, so alpha is the absolute norm added to the hidden
# state -- and hidden states are not the same size at every layer. Measured per-token on
# answer tokens: |h| is 6.4 at layer 8, 8.7 at 12, 22.2 at 24. A flat alpha 2 would be
# 31% of the residual stream at layer 8 but 9% at layer 24, so layer differences would
# partly be strength differences. raw_norm tracks |h| (~10% of it at every layer
# measured), so --alpha-rel holds the relative push fixed and lets the layer comparison
# mean what it says.
#
# Sweep: layers 12 and 24 x --alpha-rel 2 and 4.
#   ./run.sh steer_llamat2_cif_density --layer 12 --alpha-rel 2
#   ./run.sh steer_llamat2_cif_density --layer 24 --alpha-rel 4
# Pairs on id against baseline_llamat2_cif.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="llamat"
QUEUE="gpu"
GPUS="1"
TIME="24:00:00"
MEM="32G"
CPUS="4"
ARGS="--model llamat2_cif --ckpt-dir models/llamat2_cif
      --prompt-csv data/llamat_test_sample1000.csv
      --method linear --steering-property density_atomic
      --layer 24 --alpha-rel 2 --n-samples 3
      --max-new-tokens 600 --temperature 0.01 --top-p 0.95
      --paired-seed --torch-dtype float16
      --results-dir steering_results/density_atomic"
