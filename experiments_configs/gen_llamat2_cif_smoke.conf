# Smoke test for llamat2-cif steered generation: does the model produce crystal
# strings, do they decode into CIFs, and does the hook change the output?
#
# UNCONDITIONAL, so there is NO prompt set. The prompt is one constant 203-token
# instruction and every sample is an independent draw, which means arms cannot be
# paired on `id` the way every crystallm result is (CLAUDE.md: "each arm and the
# alpha=0 control pair on id"). --paired-seed gives draw k of every arm the same
# random stream (common random numbers), which is what makes a paired comparison
# defensible here; the ids below are draw indices, not materials.
#
# SAMPLING. temperature 0.01 / top_p 0.95 are the authors' own notebook settings,
# the ones that produced their published CIF generations.
#
# Both raw_output and cif_steered are saved. An empty cif_steered means decoding
# failed and decode_reason says how, with the crystal string kept for diagnosis.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="llamat"
QUEUE="gpu"
GPUS="1"
TIME="02:00:00"
MEM="32G"
CPUS="4"
ARGS="--model llamat2_cif --ckpt-dir models/llamat2_cif
      --method linear --steering-property band_gap
      --layer 24 --alpha 0 --n-prompts 10 --n-samples 2
      --max-new-tokens 400 --temperature 0.01 --top-p 0.95
      --paired-seed --torch-dtype float16
      --results-dir steering_results/llamat_smoke"
