# Manifold steering, BAND GAP, LAYER 4, width 0.05, prompts WITHOUT the space group.
# Companion to steer_linear_bandgap_l4_nosg.conf: same layer, same prompts, same
# control, so the only difference is curve vs straight line.
# The curve spans band gap 0.025..2.175 eV over arc 0..56.49, and it is FAR from
# uniform in the property: the first tenth of the arc covers 0.025..0.369 eV, the
# last tenth only 1.99..2.175. So a fixed arc step buys a lot of gap low on the
# curve and very little high up.
# Override --delta (2, 3) and --scale (1..10) per run.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method manifold --steering-property bandgap
      --manifold steering_vectors/manifolds/dos_electronic_band_gap_layer4_k64_w0.05.parquet
      --layer 4 --k 64 --delta 2 --variant residual --scale 1
      --n-samples 3 --temperature 1.0
      --use-cache --results-dir steering_results/bandgap"
