# PCA subspace for llamat2-cif, one layer per run (override --layer).
#
# k=32 out of 4096 dims, against crystallm's k=64 out of 1024 -- a far smaller fraction
# of the space, so watch the explained variance this reports. The manifold is fitted
# inside this subspace, so if k=32 captures little, the curve is being drawn through a
# projection that has already thrown most of the signal away.
#
# not_heldout: steering artifacts are fitted there and never on the held-out set. For
# llamat2_cif that is the 132,839 embedded structures outside the crystal-text-llm test
# set -- see utils.SPLIT_FILES.
SCRIPT="scripts/steering/compute_pca_basis.py"
VENV="crystallm"
QUEUE="batch"
TIME="06:00:00"
MEM="64G"
CPUS="8"
ARGS="--dataset v1_mp --model llamat2_cif --variant crystal_uncond
      --partition not_heldout --k 32 --layer 8"
