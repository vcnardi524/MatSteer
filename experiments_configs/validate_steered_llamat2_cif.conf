# Validation for llamat2-cif runs. THREE-check bar, deliberately.
#
# is_valid here is formula + atom site multiplicity + bond length. The fourth term
# crystallm uses, is_space_group_consistent, is dropped because llamat2-cif never states
# a space group: its CIFs are written in P 1, so "stated vs detected" fails for every
# structure that has real symmetry and measures the decoder rather than the model.
# space_group_detected is still recorded -- what symmetry the generated coordinates carry
# is worth knowing, it just does not gate validity.
#
# A llamat is_valid number is therefore NOT directly comparable to a crystallm one. Say
# which bar you are quoting whenever the two appear together.
#
# TRUNCATION IS INVALID. --max-new-tokens must match what generation used (600). A sample
# that reached the cap was cut off mid-structure: the cell from line 1 is complete but
# most of its atoms were never written, so volume per atom reads ~7% high. The CIF cannot
# show this -- formula and multiplicity both pass at 100%, because a truncated crystal is
# internally consistent -- and bond_length only catches ~90% of them incidentally.
# n_new_tokens settles it exactly: nothing stops one token short of the cap.
#
# Point --input at one generated_cifs parquet; --results-dir decides where the flags land.
SCRIPT="scripts/eval/validate_steered_cifs.py"
VENV="crystallm"
QUEUE="batch"
TIME="4:00:00"
MEM="16G"
CPUS="16"
ARGS="--workers 16 --no-space-group-check --max-new-tokens 600
      --results-dir steering_results/llamat2_cif/bandgap"
