# Linear probe R^2 for a continuous property across all 16 layers, vs a composition
# baseline. Fit on CrystaLLM's train split, scored on val; by_formula holds out unseen
# chemistry. Read margin_over_best_baseline, not embedding_r2 -- composition alone
# already gets 0.43 for density, since element counts hand the model the atom count.
SCRIPT="scripts/analysis/property_probe.py"
VENV="crystallm"
QUEUE="batch"
TIME="12:00:00"
MEM="96G"
CPUS="8"
ARGS="--property density_atomic --labels density_atomic_v1.parquet
      --dataset v1_all --variant full --train-sample 200000 --eval-sample 50000"
