# Linear mean-difference steering, band gap. nosg prompts: the only alpha=0 control
# for band gap is the nosg family, and a paired test needs the same prompt set.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test.pkl.gz
      --method linear --steering-property bandgap --alpha 40 --layer 14
      --n-prompts 1000 --n-samples 3 --temperature 1.0 --use-cache
      --results-dir steering_results/bandgap"
