# Bucket-centroid PCA for MP band gap, layer 14. v1_mp has no split, hence --partition all.
SCRIPT="scripts/plots/centroid_pca_plots.py"
VENV="crystallm"
QUEUE="batch"
TIME="4:00:00"
MEM="48G"
CPUS="8"
ARGS="--partition all --property band_gap --labels metadata_mp.parquet --id-col material_id
      --dataset v1_mp --layer 14 --width 0.1 --sample 5000 --max-per-bucket 5000"
