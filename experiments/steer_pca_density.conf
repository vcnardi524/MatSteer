# pca_centroid steering, density target 30. Pass --t to sweep strength.
SCRIPT="scripts/steering/steer_generate_cif.py"
VENV="crystallm"
QUEUE="gpu"
GPUS="1"
TIME="36:00:00"
MEM="32G"
CPUS="4"
ARGS="--model CrystaLLM/crystallm_v1_large --pkl CrystaLLM/cifs_v1_test_sample1000.pkl.gz
      --method pca_centroid --steering-property density_atomic --target 30 --k 64
      --layer 14 --t 0.5 --n-samples 3 --temperature 1.0 --with-spacegroup --use-cache
      --results-dir steering_results/density_atomic"
